    <circle cx="1016" cy="158" r="88" stroke-width="0.5" opacity="0.12"/>
    <circle cx="1016" cy="158" r="96" stroke-width="0.3" opacity="0.07"/>
    <circle cx="1016" cy="158" r="104" stroke-width="0.2" opacity="0.04"/>
  </g>

  <!-- Title block -->
  <g font-family="'Haas Grot Disp Trial', 'Haas Grot Text Trial', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" filter="url(#textsoft)" opacity="0.55">
    <text x="52" y="82" font-size="15" font-weight="500" fill="#020408" letter-spacing="5.5">[ WARLOCK · VOIDWALKER · THE HIDDEN ]</text>
    <text x="52" y="142" font-size="58" font-weight="700" fill="#020408" letter-spacing="1">IKORA REY</text>
    <text x="52" y="188" font-size="17" font-weight="500" fill="#020408" letter-spacing="3.5">AGENT BRAIN  /  WRAPPER</text>
    <text x="54" y="218" font-size="13.5" font-weight="400" fill="#020408" letter-spacing="2.5">THE VOID IS NOT EMPTY. IT IS FULL OF POSSIBILITY.</text>
  </g>
  <g font-family="'Haas Grot Disp Trial', 'Haas Grot Text Trial', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif">
    <text x="52" y="82" font-size="15" font-weight="500" fill="#3b82f6" letter-spacing="5.5">[ WARLOCK · VOIDWALKER · THE HIDDEN ]</text>
    <text x="52" y="142" font-size="58" font-weight="700" fill="#dbeafe" letter-spacing="1">IKORA REY</text>
    <text x="52" y="188" font-size="17" font-weight="500" fill="#93c5fd" letter-spacing="3.5">AGENT BRAIN  /  WRAPPER</text>
    <text x="54" y="218" font-size="13.5" font-weight="400" fill="#a8a8a8" letter-spacing="2.5">THE VOID IS NOT EMPTY. <tspan x="300" fill="#4a9eff">IT IS FULL OF POSSIBILITY.</tspan></text>
  </g>

  <!-- Accent bar under subtitle -->
