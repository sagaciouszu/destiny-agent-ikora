<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Ikora Rey - Agent Brain / Wrapper">
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#020408"/>
      <stop offset="40%" stop-color="#050a14"/>
      <stop offset="100%" stop-color="#091220"/>
    </linearGradient>
    <radialGradient id="blueglow" cx="0.75" cy="0.45" r="0.58">
      <stop offset="0%" stop-color="#4a9eff" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="voidglow" cx="0.25" cy="0.55" r="0.42">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreglow" cx="0.5" cy="0.35" r="0.25">
      <stop offset="0%" stop-color="#dbeafe" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="textsoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.72">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="accentbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="1"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="leftfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="0.22"/>
      <stop offset="25%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#space)"/>
  <rect width="1200" height="320" fill="url(#blueglow)"/>
  <rect width="1200" height="320" fill="url(#voidglow)"/>
  <rect width="1200" height="320" fill="url(#coreglow)"/>

  <!-- Void particulates -->
  <g fill="#7cc3fa">
    <circle cx="78" cy="52" r="1.3" opacity="0.75"/>
    <circle cx="205" cy="172" r="0.9" opacity="0.5"/>
    <circle cx="335" cy="76" r="1.4" opacity="0.8"/>
    <circle cx="455" cy="226" r="0.9" opacity="0.5"/>
    <circle cx="545" cy="72" r="1.1" opacity="0.65"/>
    <circle cx="630" cy="252" r="1.3" opacity="0.7"/>
    <circle cx="715" cy="92" r="0.8" opacity="0.5"/>
    <circle cx="790" cy="234" r="1.0" opacity="0.6"/>
    <circle cx="60" cy="244" r="1.0" opacity="0.55"/>
    <circle cx="985" cy="62" r="1.2" opacity="0.7"/>
    <circle cx="1070" cy="256" r="0.9" opacity="0.5"/>
    <circle cx="285" cy="274" r="1.1" opacity="0.6"/>
    <circle cx="490" cy="162" r="0.7" opacity="0.4"/>
    <circle cx="850" cy="132" r="1.2" opacity="0.65"/>
    <circle cx="158" cy="194" r="0.7" opacity="0.4"/>
    <circle cx="740" cy="274" r="0.8" opacity="0.5"/>
    <circle cx="410" cy="46" r="1.0" opacity="0.55"/>
    <circle cx="920" cy="194" r="0.8" opacity="0.45"/>
    <circle cx="125" cy="126" r="0.9" opacity="0.5"/>
    <circle cx="1120" cy="144" r="1.0" opacity="0.6"/>
  </g>

  <!-- Fine grid -->
  <g stroke="#3b82f6" stroke-width="0.35" opacity="0.04">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="260" y1="0" x2="260" y2="320"/>
    <line x1="520" y1="0" x2="520" y2="320"/>
    <line x1="780" y1="0" x2="780" y2="320"/>
    <line x1="1040" y1="0" x2="1040" y2="320"/>
  </g>

  <!-- Warlock bond / Void symbol -->
  <g transform="translate(1030,158) scale(3.0) translate(-16, -16)" opacity="0.75" fill="#4a9eff">
    <path d="M16 4c-4.418 0-8 3.582-8 8s3.582 8 8 8 8-3.582 8-8-3.582-8-8-8zm0 24c-4.418 0-8 3.582-8 8s3.582 8 8 8 8-3.582 8-8-3.582-8-8-8z"/>
    <path d="M4 16c0-4.418 3.582-8 8-8s8 3.582 8 8-3.582 8-8 8-8-3.582-8-8zm0-12c-4.418 0-8 3.582-8 8s3.582 8 8 8 8-3.582 8-8-3.582-8-8-8z"/>
    <path d="M28 16c0-4.418 3.582-8 8-8s8 3.582 8 8-3.582 8-8 8-8-3.582-8-8zm0-12c-4.418 0-8 3.582-8 8s3.582 8 8 8 8-3.582 8-8-3.582-8-8-8z"/>
    <path d="M4 4c-4.418 0-8 3.582-8 8s3.582 8 8 8 8-3.582 8-8-3.582-8-8-8zm0 24c-4.418 0-8 3.582-8 8s3.582 8 8 8 8-3.582 8-8-3.582-8-8-8z"/>
    <path d="M16 28c0-4.418 3.582-8 8-8s8 3.582 8 8-3.582 8-8 8-8-3.582-8-8zm0-12c-4.418 0-8 3.582-8 8s3.582 8 8 8 8-3.582 8-8-3.582-8-8-8z"/>
  </g>

  <!-- Concentric reticles -->
  <g fill="none" stroke="#3b82f6">
    <circle cx="1030" cy="158" r="88" stroke-width="0.5" opacity="0.12"/>
    <circle cx="1030" cy="158" r="96" stroke-width="0.3" opacity="0.07"/>
    <circle cx="1030" cy="158" r="104" stroke-width="0.2" opacity="0.04"/>
  </g>

  <!-- Title block -->
  <g font-family="'Haas Grot Disp Trial', 'Haas Grot Text Trial', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" filter="url(#textsoft)" opacity="0.55">
    <text x="52" y="82" font-size="15" font-weight="500" fill="#020408" letter-spacing="5.5">[ WARLOCK VANGUARD  ·  THE HIDDEN  ·  VOID ]</text>
    <text x="52" y="142" font-size="58" font-weight="700" fill="#020408" letter-spacing="1">IKORA REY</text>
    <text x="52" y="188" font-size="17" font-weight="500" fill="#020408" letter-spacing="3.5">AGENT BRAIN  /  WRAPPER</text>
    <text x="54" y="218" font-size="13.5" font-weight="400" fill="#020408" letter-spacing="2.5">THE VOID DOES NOT ASK. IT ANSWERS.</text>
  </g>
  <g font-family="'Haas Grot Disp Trial', 'Haas Grot Text Trial', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif">
    <text x="52" y="82" font-size="15" font-weight="500" fill="#3b82f6" letter-spacing="5.5">[ WARLOCK VANGUARD  ·  THE HIDDEN  ·  VOID ]</text>
    <text x="52" y="142" font-size="58" font-weight="700" fill="#eff6ff" letter-spacing="1">IKORA REY</text>
    <text x="52" y="188" font-size="17" font-weight="500" fill="#93c5fd" letter-spacing="3.5">AGENT BRAIN  /  WRAPPER</text>
    <text x="54" y="218" font-size="13.5" font-weight="400" fill="#a8a8a8" letter-spacing="2.5">THE VOID DOES NOT ASK. <tspan x="222" fill="#60a5fa">IT ANSWERS.</tspan></text>
  </g>

  <rect x="52" y="160" width="320" height="1" fill="url(#accentbar)"/>

  <text transform="translate(1180, 236) rotate(-90)" font-family="'Haas Grot Disp Trial', 'Haas Grot Text Trial', 'Inter', sans-serif" font-size="6.5" font-weight="500" letter-spacing="1.2" fill="#3b82f6" opacity="0.18">THE TOWER  ·  THE HIDDEN  ·  VOID LIGHT</text>

  <g fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.35">
    <path d="M 20 42 L 20 20 L 42 20"/>
    <path d="M 1180 278 L 1180 300 L 1158 300"/>
  </g>

  <rect width="320" height="320" fill="url(#leftfade)"/>
  <rect width="1200" height="320" fill="url(#vig)" pointer-events="none"/>
</svg>